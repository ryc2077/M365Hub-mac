name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    # macos-15 ships Xcode 16.x, matching the Mac the app is tested on
    # (Xcode < 26: glassEffect falls back to ultraThinMaterial).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project M365HubApp.xcodeproj

      - name: Build (unsigned, CI only)
        run: |
          xcodebuild -project M365HubApp.xcodeproj \
            -target M365Hub \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Upload built app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M365Hub-macOS
          path: build/Build/Products/Debug/M365Hub.app
