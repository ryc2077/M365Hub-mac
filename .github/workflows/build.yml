name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  # The real-account test posts the short-lived device code to an issue so
  # the operator can read it instantly (job logs lag ~20 minutes); the
  # issue is closed by the test script when it finishes.
  issues: write

jobs:
  build:
    # macos-15 ships Xcode 16.x, matching the Mac the app is tested on
    # (Xcode < 26: glassEffect falls back to ultraThinMaterial).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project M365HubApp.xcodeproj

      - name: Build (unsigned, CI only)
        run: |
          xcodebuild -project M365HubApp.xcodeproj \
            -scheme M365Hub \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # The app hangs on "正在启动本地网关…" when its gateway never
      # answers, so the build is not done until the bundled gateway is
      # proven to start and answer /api/admin/session, cold, the way the
      # app launches it (fresh data dir, M365_LISTEN=127.0.0.1:8230).
      - name: Gateway cold-start test
        run: bash scripts/test-gateway.sh build/Build/Products/Debug/M365Hub.app

      # Launch the real app, screenshot it, and check whether its own
      # gateway came up. Best effort: the screenshot and logs are the
      # evidence; a missing display must not hide the gateway result.
      - name: Launch app and screenshot
        continue-on-error: true
        run: bash scripts/test-applaunch.sh build/Build/Products/Debug/M365Hub.app

      # Account-add + chat, through the exact endpoints the Mac UI calls:
      # admin login (forced password change), accounts list, PKCE/device
      # start, bogus callback rejection, and chat with zero accounts.
      # Completing the Microsoft sign-in needs a human in the browser, so
      # this proves the flows start and fail cleanly; it cannot mint an
      # account by itself.
      - name: Account add and chat test
        run: bash scripts/test-account-chat.sh build/Build/Products/Debug/M365Hub.app

      # Restore the gateway data dir (~/.config/m365hub: accounts +
      # tokens) from the previous run, so the real account survives
      # between runs and the PKCE login round trip is only needed once,
      # to seed the cache. The account-chat test above runs fresh on
      # purpose (it proves the no-account flows), so the restore goes
      # here, after it and before the PKCE step. The app is not running
      # at this point (the account-chat test quits it), and the fresh
      # data dir it just created is cleared first so the restore cannot
      # merge with it. On the first run there is no cache and the
      # restore is a no-op; the PKCE step then seeds the account.
      - name: Clear the fresh gateway data dir before restore
        run: rm -rf "$HOME/.config/m365hub"

      - name: Restore gateway data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/m365hub
          key: m365hub-mac-data-${{ github.run_id }}
          restore-keys: |
            m365hub-mac-data-

      # Real-account test via PKCE: add a Microsoft 365 account through
      # the browser PKCE flow and send one real chat message. PKCE uses
      # the Office web Copilot client, not the FOCI "Microsoft Office"
      # client the device-code flow uses, so a Conditional Access policy
      # that blocks the latter may still allow this. The operator signs
      # in with the auth URL from the issue and posts the callback URL
      # back as a comment; the script polls for it (see the script).
      # No account credential is stored in the repo or the workflow.
      # The auth URL goes out through an issue (see the script), so pass
      # the token explicitly: $GITHUB_TOKEN is not set in run steps on
      # its own.
      # If the cache restore above already brought the account back, the
      # script skips the login round trip and only verifies the restored
      # account still chats.
      - name: Real account test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/test-real-account-pkce.sh build/Build/Products/Debug/M365Hub.app

      # CodeX tool-call test: run the Codex CLI against the same gateway
      # the PKCE step just added the real account to, in YOLO mode, and
      # prove it really writes files (create hello.txt, append a line,
      # cat it). The PKCE step leaves the app running so this step can
      # reuse its gateway; this step quits the app when it is done. Same
      # shape as the Windows test (green on its run 21).
      - name: CodeX tool-call test
        run: bash scripts/test-codex-mac.sh

      # Desktop-flow test: the CLI (gpt-4-auto) calls tools fine, but the
      # user's desktop CodeX (default model gpt-6.1-sol-reasoning) only
      # talks about a plan and never acts. Test the reasoning model on
      # its own, through the same gateway, on both API shapes a desktop
      # client could use, plus the CLI with that model. Relaunches the
      # app itself (the CodeX step quits it) and quits it on the way out.
      # Runs even when the CodeX step fails (if: always), so a flaky
      # model-choice failure there cannot hide the desktop-flow result.
      - name: Desktop flow test
        if: always()
        run: bash scripts/test-desktop-flow.sh build/Build/Products/Debug/M365Hub.app

      # Save the gateway data dir (now holding the real account) for the
      # next run. Only when an account is actually in it, so a failed
      # run can never overwrite the good cache with an empty data dir.
      # The app is quit first (the CodeX step quits it on its way out,
      # and this step quits it again as a belt-and-braces so the save
      # cannot catch the gateway mid-write).
      - name: Check for a saved account
        id: check-account
        if: always()
        run: |
          osascript -e 'tell application "M365Hub" to quit' 2>/dev/null || pkill -f "M365Hub.app" 2>/dev/null || true
          sleep 2
          if grep -q "copilot@wt3z38wld.onmicrosoft.com" "$HOME/.config/m365hub/accounts.json" 2>/dev/null; then
            echo "has_account=true" >> "$GITHUB_OUTPUT"
            echo "account present in the data dir; the cache will be saved"
          else
            echo "has_account=false" >> "$GITHUB_OUTPUT"
            echo "no account in the data dir; the cache will NOT be saved"
          fi

      - name: Save gateway data cache
        if: always() && steps.check-account.outputs.has_account == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.config/m365hub
          key: m365hub-mac-data-${{ github.run_id }}

      - name: Collect test evidence
        if: always()
        run: |
          mkdir -p test-evidence
          cp "${RUNNER_TEMP}/m365hub-app-shot.png" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-app-shot-late.png" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-account-chat-shot.png" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-account-chat-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-real-account-shot.png" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-real-account-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-real-account-pkce-shot.png" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-real-account-pkce-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-codex-mac-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}"/codex*.log test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/codex-mac-test/hello.txt" test-evidence/codex-hello.txt 2>/dev/null || true
          cp "${RUNNER_TEMP}/codex-mac-test/tools/"*.txt test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-desktop-flow-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}"/desktop-p*.log test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/codex-reasoning-test/reasoning-model.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-gateway-test/serve-test.log" test-evidence/ 2>/dev/null || true
          cp "$HOME/.config/m365hub/serve-mac.log" test-evidence/ 2>/dev/null || true
          ls -la test-evidence/

      - name: Upload built app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M365Hub-macOS
          path: build/Build/Products/Debug/M365Hub.app

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-evidence
          path: test-evidence/
          if-no-files-found: warn
